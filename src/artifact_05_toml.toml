[package]
name = "travel_boost"
version = "0.1.0"
description = "Decentralized Breakpoint 2026 Content-to-Travel Grant Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "travel_boost"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }