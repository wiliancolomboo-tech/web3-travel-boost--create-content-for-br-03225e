version: "3.8"

services:
  breakpoint-oracle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakpoint-oracle-worker
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Boost11111111111111111111111111111111111111
      - AUTHORITY_PRIVATE_KEY=[1,2,3,4,5,...]
      - RESEND_API_KEY=${RESEND_API_KEY:-mock_key}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"