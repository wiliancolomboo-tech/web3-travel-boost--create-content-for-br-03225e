version: "3.9"

services:
  travelboost-oracle-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelboost-worker
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_YOUR_PRODUCTION_RESEND_API_KEY
      - CAMPAIGN_PROGRAM_ID=TrvL8o2sTxE9mYpB6uA12KzQ4bFv4jXm9KzT7mP1vN8
      - NODE_ENV=production
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"