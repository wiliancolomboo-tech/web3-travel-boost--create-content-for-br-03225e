version: "3.8"

services:
  travelboost-oracle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakpoint-travelboost-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=TrvL86V7K4qE5q9sA5tW4bMvUeB2NqV5cZ7h8mP1r9d
      - ORACLE_PRIVATE_KEY=[1,2,3...your_key_array]
      - RESEND_API_KEY=re_enterprise_key_123456789
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - NOTIFICATION_EMAIL_FROM=grants@breakpoint2026.solana.com
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3