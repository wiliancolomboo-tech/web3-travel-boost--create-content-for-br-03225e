version: '3.8'

services:
  travel-boost-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_boost_breakpoint_daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=TrvL8BoostBreakPoint20261111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NOTIFICATION_SENDER=grants@solanabreakpoint2026.com
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"